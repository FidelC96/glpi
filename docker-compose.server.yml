# Override para el servidor (elune): GLPI NO publica ningún puerto en el host.
# nginx (contenedor en la red externa `odoo-network`) le llega por nombre: http://glpi_gspn_app:80
# MariaDB permanece solo en la red privada del stack.
#
# Uso:  docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
services:
  glpi:
    ports: !reset []
    networks:
      - default
      - proxy
    environment:
      GLPI_URL_BASE: ${GLPI_URL_BASE:-}

  db:
    networks:
      - default

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-odoo-network}
